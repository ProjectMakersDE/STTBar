<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A40"/>
      <stop offset="1" stop-color="#0B111C"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="211" y1="0" x2="673" y2="0">
      <stop offset="0" stop-color="#14F2AD"/>
      <stop offset="0.55" stop-color="#33A3FF"/>
      <stop offset="1" stop-color="#C78AFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <g filter="url(#glow)"><rect x="211" y="412.0" width="52" height="200" rx="17" fill="url(#wave)"/><rect x="293" y="322.0" width="52" height="380" rx="17" fill="url(#wave)"/><rect x="375" y="247.0" width="52" height="530" rx="17" fill="url(#wave)"/><rect x="457" y="347.0" width="52" height="330" rx="17" fill="url(#wave)"/><rect x="539" y="282.0" width="52" height="460" rx="17" fill="url(#wave)"/><rect x="621" y="392.0" width="52" height="240" rx="17" fill="url(#wave)"/></g>
  <rect x="740" y="292.0" width="22" height="440" rx="-3" fill="#F4F6FA"/><rect x="705" y="292.0" width="92" height="22" rx="2" fill="#F4F6FA"/><rect x="705" y="710.0" width="92" height="22" rx="2" fill="#F4F6FA"/>
