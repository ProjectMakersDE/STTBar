name: CI

# Native develop builds are explicit. Releases run their own tests.
on:
  workflow_dispatch:

jobs:
  test:
    # Only the current release MacBook may execute native builds.
    runs-on: [self-hosted, macOS, ARM64, daniel-macbook-native]
    steps:
      - uses: actions/checkout@v5

      - name: Swift tests
        run: swift test --package-path macos-app

      - name: Shell tests
        run: |
          for t in tests/*.sh; do
            echo "== $t"
            bash "$t"
          done

      - name: Build app bundle
        run: bash macos-app/build-app.sh "$RUNNER_TEMP/sttbar-build-check"
